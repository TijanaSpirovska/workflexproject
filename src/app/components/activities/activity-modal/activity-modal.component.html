<div *ngIf="isOpen" class="modal-backdrop">
  <div class="form-modal">
    <button class="close-btn" (click)="onClose()">×</button>
    <h3>{{ isEdit ? "Edit" : "Add New" }} Activity</h3>

    <form *ngIf="formGroup" [formGroup]="formGroup">
      <div class="group-container">
        <!-- Activity Name -->
        <div class="field has-support-text">
          <label class="field-name" for="activityName">Activity Name</label>
          <input
            id="activityName"
            type="text"
            formControlName="activityName"
            placeholder="Enter activity name"
            [class.invalid]="formGroup.get('activityName')?.invalid"
          />
        </div>

        <!-- Description -->
        <div class="field has-support-text">
          <label class="field-name" for="description">Description</label>
          <input
            id="description"
            type="text"
            formControlName="description"
            placeholder="Enter description"
            [class.invalid]="formGroup.get('description')?.invalid"
          />
        </div>
      </div>

      <div class="group-container">
        <!-- Activity Type -->
        <div class="field has-support-text">
          <label class="field-name" for="activityType">Activity Type</label>
          <input
            id="activityType"
            type="text"
            formControlName="activityType"
            placeholder="e.g. Hiking, Culture"
            [class.invalid]="formGroup.get('activityType')?.invalid"
          />
        </div>

        <!-- Transportation -->
        <div class="field has-support-text">
          <label class="field-name" for="transportation">Transportation</label>
          <input
            id="transportation"
            type="text"
            formControlName="transportation"
            placeholder="e.g. On foot, Bus"
            [class.invalid]="formGroup.get('transportation')?.invalid"
          />
        </div>
      </div>

      <div class="group-container">
        <!-- Duration -->
        <div class="field has-support-text">
          <label class="field-name" for="durationHours">Duration (hours)</label>
          <input
            id="durationHours"
            type="number"
            min="0"
            formControlName="durationHours"
            placeholder="e.g. 2.5"
            [class.invalid]="formGroup.get('durationHours')?.invalid"
          />
        </div>

        <!-- Number of People -->
        <div class="field has-support-text">
          <label class="field-name" for="numberOfPeople"
            >Number of People</label
          >
          <input
            id="numberOfPeople"
            type="number"
            min="1"
            formControlName="numberOfPeople"
            placeholder="Number of people"
            [class.invalid]="formGroup.get('numberOfPeople')?.invalid"
          />
        </div>
      </div>

      <!-- Start Time -->
      <div class="group-container">
        <div class="field has-support-text">
          <label class="field-name" for="startTime">Start Time</label>
          <div class="form-group date-icon">
            <div class="input-wrapper">
              <input
                id="startTime"
                type="text"
                [matDatepicker]="startDatePicker"
                formControlName="startTime"
                [class.invalid]="formGroup.get('startTime')?.invalid"
                readonly
              />
              <mat-datepicker-toggle
                matSuffix
                [for]="startDatePicker"
                class="calendar-toggle"
              >
                <i class="calendar-icon"></i>
              </mat-datepicker-toggle>
            </div>
            <mat-datepicker #startDatePicker></mat-datepicker>
          </div>
        </div>
        <!-- Address -->
        <div class="field has-support-text">
          <label class="field-name" for="address">Address</label>
          <input
            id="address"
            type="text"
            formControlName="address"
            placeholder="Enter Address"
            [class.invalid]="formGroup.get('address')?.invalid"
          />
        </div>
      </div>

      <!-- Image Upload -->
      <div class="field">
        <label class="field-name">Activity Image</label>
        <div class="file-upload">
          <input
            type="file"
            id="activityImage"
            (change)="onFileSelected($event)"
            accept="image/*"
          />
          <label for="activityImage" class="upload-button">
            <i class="fas fa-upload"></i> Choose Image
          </label>
          <span class="file-name">
            {{ imagePreviewUrl ? "Image selected" : "No file chosen" }}
          </span>
        </div>

        <!-- Image Preview -->
        <div class="image-preview" *ngIf="imagePreviewUrl">
          <img [src]="imagePreviewUrl" alt="Activity preview" />
          <button class="remove-image" type="button" title="Remove image">
            ×
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="button cancel-btn" (click)="onClose()">
          Cancel
        </button>
        <button
          type="button"
          class="button submit-btn"
          [disabled]="formGroup.invalid"
          (click)="onSave()"
        >
          {{ isEdit ? "Update" : "Create" }} Activity
        </button>
      </div>
    </form>
  </div>
</div>
