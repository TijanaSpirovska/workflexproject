<app-menu (onExpanded)="onExpanded($event)" [isVisible]="true"></app-menu>
<div class="trips-container" [class.expanded]="isExpanded">
  <div
    class="background"
    [ngStyle]="{
      'background-image':
        'url(' +
        (trips && trips.length > 0 && trips[selectedTripIndex].imageUrl
          ? trips[selectedTripIndex].imageUrl
          : defaultImageUrl) +
        ')'
    }"
  >
    <!-- Overlay text -->
    <div class="overlay-content">
      <h1>
        {{
          trips && trips.length > 0
            ? trips[selectedTripIndex].tripName
            : "Loading..."
        }}
      </h1>
      <p>
        {{
          trips && trips.length > 0
            ? trips[selectedTripIndex].description
            : "Please wait while we load your trips"
        }}
      </p>
      <div
        class="date-range"
        *ngIf="trips && trips.length > 0 && trips[selectedTripIndex].startDate"
      >
        <i class="fas fa-calendar"></i>
        {{ getDateRangeString(trips[selectedTripIndex]) }}
      </div>
      <button class="read-more" (click)="viewTripDetails(selectedTripIndex)">
        READ MORE
      </button>
    </div>

    <!-- Cards on right side starting from middle -->
    <div class="scroll-container-wrapper">
      <button class="scroll-button left" (click)="scroll(-300)">‹</button>
      <div class="scroll-container" #scrollContainer>
        <div
          class="trip-card"
          *ngFor="let trip of trips; let i = index"
          (mouseenter)="selectTrip(i)"
          (mouseleave)="onLeave($event)"
          [class.active]="i === selectedTripIndex"
          (click)="viewTripDetails(i)"
        >
          <img [src]="trip.imageUrl || defaultImageUrl" [alt]="trip.tripName" />
          <div class="trip-info">
            <div class="trip-label">{{ trip.tripName }}</div>
            <div class="trip-dates" *ngIf="trip.startDate && trip.endDate">
              {{ getDateRangeString(trip) }}
            </div>
          </div>
        </div>
      </div>

      <button class="scroll-button right" (click)="scroll(300)">›</button>
    </div>
  </div>
</div>
